---
- name: Install fail2ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present

- name: Configure the jails
  ansible.builtin.template:
    src: jail-local.conf.j2
    dest: /etc/fail2ban/jail.d/10-server.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Run fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
