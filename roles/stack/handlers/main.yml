---
- name: Reload Caddy
  ansible.builtin.shell: |
    set -e
    # On the first run Caddy is not running yet; it reads the file when it starts.
    if [ -n "$(docker compose ps -q caddy)" ]; then
      docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
    fi
  args:
    chdir: "{{ stack_dir }}"
    executable: /bin/bash
  changed_when: true
