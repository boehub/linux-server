---
- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the repository folder (local repositories only)
  ansible.builtin.file:
    path: "{{ backup_repo }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: backup_repo.startswith('/')

# The password encrypts the backups. It is made once and never replaced; copy it somewhere
# safe (a password manager), because without it the backups cannot be read.
- name: Generate the repository password (once)
  ansible.builtin.shell: |
    set -eo pipefail
    umask 077
    head -c 32 /dev/urandom | base64 > /etc/restic/password
  args:
    creates: /etc/restic/password
    executable: /bin/bash

- name: Write the backup settings
  ansible.builtin.template:
    src: env.j2
    dest: /etc/restic/env
    owner: root
    group: root
    mode: "0600"

- name: Write the exclude list
  ansible.builtin.copy:
    content: "{{ backup_excludes | join('\n') }}\n"
    dest: /etc/restic/excludes
    owner: root
    group: root
    mode: "0600"

- name: Install the backup and restore-test scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - server-backup
    - server-restore-test

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - server-backup.service
    - server-backup.timer
  notify: Reload systemd for backups

- name: Make systemd read the new units now
  ansible.builtin.meta: flush_handlers

- name: Schedule the backups
  ansible.builtin.systemd:
    name: server-backup.timer
    enabled: true
    state: started

# One backup right away, so the repository exists and a problem shows up now, not at 03:30.
- name: Make the first backup
  ansible.builtin.command: /usr/local/bin/server-backup
  args:
    creates: /var/lib/server-backup/last-success
